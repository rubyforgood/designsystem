name: checks

on:
  push:
  pull_request:

jobs:
  hygiene:
    name: syntax, seam, doc links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax-check every JS audit
        run: |
          fail=0
          for f in $(find bin/design examples -name "*.js"); do
            node --check "$f" || fail=1
          done
          exit $fail

      - name: Syntax-check every Ruby audit
        run: |
          fail=0
          for f in $(find bin/design -name "*.rb"); do
            ruby -c "$f" > /dev/null || fail=1
          done
          exit $fail

      - name: Syntax-check every Python audit
        run: |
          fail=0
          for f in $(find bin/design -name "*.py"); do
            python3 -m py_compile "$f" || fail=1
          done
          exit $fail

      # Ratchets duplicated signIn functions -- see bin/design/seam-check.rb's own header for why
      # this needs to be its own check rather than trusted to code review.
      - name: Seam check
        run: ruby bin/design/seam-check.rb

      # design.md and docs/**/*.md cross-reference each other with #anchor links; this catches a
      # renamed heading or a typo'd fragment before a reader does.
      - name: Doc link audit
        run: ruby bin/design/doc-link-audit.rb

      # Catches new industry-precedent claims whose form outruns the checking behind them (see
      # bin/design/citation-audit.py's own header) before they sit undetected for a month, the way
      # the previous three did.
      - name: Citation audit
        run: python3 bin/design/citation-audit.py --check

  components-build:
    name: components build, Storybook builds, audits run clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Catches a broken component before it ships — see components/README.md. Not yet running the
      # built output against the audit suite (that needs a Storybook/preview adapter, ADR 14's
      # named next step); this just confirms the package still compiles.
      - name: Build components
        run: npm run build

      # Catches a broken story or a config regression (e.g. an addon that fails to load) before
      # it ships. The a11y addon (.storybook/preview.js, a11y.test: "error") runs axe-core against
      # every story on open, but that only fails interactively in the dev server right now — this
      # just confirms the static build succeeds, not that every story is still accessible.
      - name: Build Storybook
        run: npm run build-storybook

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # wcag-audit.js's hardcoded path — see the audit's own header. Same convention the
      # reference-app-control-harness job below uses.
      - name: Install axe-core at the path wcag-audit.js expects
        run: npm install --no-save --prefix /tmp/axe axe-core

      - name: Serve the built Storybook site
        run: node bin/design/adapters/storybook/serve.js 4300 &

      - name: Wait for it
        run: |
          for i in $(seq 1 20); do
            curl -sf "http://127.0.0.1:4300/iframe.html?id=components-button--primary" > /dev/null && exit 0
            sleep 0.5
          done
          echo "storybook server never came up"; exit 1

      # Only wcag-audit.js and keyboard-audit.js — not button-audit.js, which audits page-header
      # button-group composition and has nothing to check on an isolated component story. See
      # docs/portability/adapter-storybook.md for why, and for the real keyboard-audit.js bug this
      # run found and fixed (a path/query-string comparison that silently skipped every target,
      # reporting "0 screens checked" rather than failing).
      #
      # wcag-audit.js fails this step on a real violation (process.exit(rules.length ? 1 : 0)).
      # keyboard-audit.js does not gate its exit code on findings at all — same as
      # responsive-audit.js/route-sweep.js elsewhere in this suite — so this step only guards
      # against it crashing or silently checking 0 screens again, not against a real keyboard
      # regression; read its printed output, don't trust a green exit alone.
      - name: Run wcag-audit.js and keyboard-audit.js against the component stories
        working-directory: bin/design/adapters/storybook
        env:
          BASE_URL: http://127.0.0.1:4300
        run: |
          cp ../../wcag-audit.js ../../keyboard-audit.js .
          node wcag-audit.js
          node keyboard-audit.js | tee /tmp/keyboard-audit.out
          # keyboard-audit.js itself always exits 0 (see the comment above) — this at least fails
          # on the exact regression this adapter found once already: 0 screens silently checked.
          grep -qE "^[1-9][0-9]* screens checked" /tmp/keyboard-audit.out

      # Behaviour axe and the keyboard audit can't see: <rfg-table>'s cell styles actually apply,
      # and <rfg-filter-bar>'s controls actually submit. Both shipped broken in v0.1.0. Exits 1 on
      # any failure, and on a missing story or an empty example, so it can't pass vacuously.
      - name: Run component-behaviour-audit.js against the table and filter bar stories
        working-directory: bin/design/adapters/storybook
        env:
          BASE_URL: http://127.0.0.1:4300
        run: node component-behaviour-audit.js

  reference-app-control-harness:
    name: reference-app audits match their documented outcome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # wcag-audit.js's hardcoded path -- see the audit's own header. Not a repo-root install
      # because the audit was written against a Rails app that isn't here; kept identical so the
      # audit runs completely unmodified, which is the entire point of this exercise.
      - name: Install axe-core at the path wcag-audit.js expects
        run: npm install --no-save --prefix /tmp/axe axe-core

      - name: Start the reference app
        run: node examples/reference-app/server.js &
        env:
          PORT: 4100

      - name: Wait for it
        run: |
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:4100/sign-in > /dev/null && exit 0
            sleep 0.5
          done
          echo "reference app never came up"; exit 1

      # See known-outcomes.js's own header: this is not audit-selftest.js (this repo has no Rails
      # app for that harness to run against) -- it's the closest thing to a control harness this
      # repo can actually run, verifying each audit's documented, measured behaviour against
      # examples/reference-app hasn't silently drifted, in either direction.
      - name: Run the known-outcomes harness
        working-directory: bin/design/adapters/reference-app
        run: node known-outcomes.js
